
<!DOCTYPE html>

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ryze: {
                            bg: '#050505',
                            card: '#0d0e12',
                            surface: '#151821',
                            border: '#1f2430',
                            silver: '#D1D5DB',
                            silverLight: '#F3F4F6',
                            silverMuted: '#9CA3AF',
                            accent: '#38BDF8'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        logo: ['Orbitron', 'sans-serif']

                }
            }

    </script>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <!-- Marked.js for HTML Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        html, body {
            background-color: #000000;
            color: #f3f4f6;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        /* Hide scrollbars for clean app feel */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .ryze-logo-text {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.25em;
        }

        /* Safe area spacing for mobile notches & bottom home bar */
        .pb-safe {
            padding-bottom: max(12px, env(safe-area-inset-bottom));
        }

        /* Content Markdown Formatting */
        .message-content {
            user-select: text;
            -webkit-user-select: text;
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        .message-content p { margin-bottom: 0.5rem; line-height: 1.5; }
        .message-content p:last-child { margin-bottom: 0; }
        .message-content pre { 
            background: #000000; 
            padding: 0.75rem; 
            border-radius: 0.75rem; 
            border: 1px solid #1f2430; 
            overflow-x: auto; 
            margin: 0.5rem 0; 
            font-size: 0.8rem; 
            position: relative;
        }
        .message-content code { 
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; 
            background: rgba(255,255,255,0.08); 
            padding: 0.15rem 0.35rem; 
            border-radius: 0.3rem; 
            font-size: 0.85em; 
            color: #38bdf8;
        }
        .message-content pre code { background: transparent; padding: 0; color: inherit; }
        .message-content ul { list-style-type: disc; margin-left: 1.2rem; margin-bottom: 0.5rem; }
        .message-content ol { list-style-type: decimal; margin-left: 1.2rem; margin-bottom: 0.5rem; }
        .message-content a { color: #38bdf8; text-decoration: underline; }

        /* Smooth Drawer slide */
        .drawer-slide {
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Pulse glowing cursor */
        .streaming-cursor::after {
            content: '▋';
            display: inline-block;
            margin-left: 2px;
            animation: pulse-cursor 0.7s infinite;
            color: #d1d5db;
        }
        @keyframes pulse-cursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Mic Pulsing */
        .mic-active {
            animation: pulse-mic 1.2s infinite;
            background-color: #ef4444 !important;
            color: #ffffff !important;
        }
        @keyframes pulse-mic {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="flex justify-center items-center bg-black">

    <!-- MOBILE CONTAINER (Max 430px for native app viewport) -->
    <div class="w-full max-w-[430px] h-full flex flex-col bg-ryze-bg relative shadow-2xl overflow-hidden border-x border-ryze-border/30">

        <!-- HEADER -->

            </button>

            <!-- RYZE BRAND & LOGO -->

        <!-- MAIN SCROLLABLE CHAT AREA -->

            <!-- WELCOME SCREEN -->
