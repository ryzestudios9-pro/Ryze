<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RYZE - AI Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Space Grotesk', 'sans-serif'] },
          colors: { oled: '#000000', surface: '#0d0e12', card: '#14161d', border: '#232733', accent: '#e2e8f0' }
        }
      }
    }
  </script>
  <style>
    body { background-color: #000; color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
    .chat-container { height: calc(100dvh - 140px); }
  </style>
</head>
<body class="h-full flex flex-col justify-between overflow-hidden">

  <!-- Header -->
  <header class="h-14 border-b border-border bg-surface/90 backdrop-blur flex items-center justify-between px-4 shrink-0">
    <div class="flex items-center gap-2">
      <svg class="w-6 h-6 text-slate-200" viewBox="0 0 100 100" fill="currentColor">
        <polygon points="10,80 50,20 50,80" />
        <polygon points="50,20 90,80 50,80" fill-opacity="0.5" />
      </svg>
      <span class="font-display font-bold tracking-widest text-lg text-white">RYZE</span>
    </div>
    <button onclick="clearChat()" class="text-xs text-slate-400 bg-card border border-border px-3 py-1.5 rounded-full hover:text-white">Clear</button>
  </header>

  <!-- Chat Messages -->
  <main id="chat-box" class="chat-container overflow-y-auto p-4 space-y-4 flex-1">
    <div class="flex flex-col items-center justify-center my-6 text-center space-y-3">
      <svg class="w-16 h-16 text-slate-300" viewBox="0 0 100 100" fill="currentColor">
        <polygon points="10,80 50,20 50,80" />
        <polygon points="50,20 90,80 50,80" fill-opacity="0.5" />
      </svg>
      <h1 class="font-display text-2xl font-bold tracking-wider text-white">RYZE</h1>
      <p class="text-xs text-slate-400 max-w-xs">High-Speed Mobile AI Agent powered by Gemini 2.5.</p>
    </div>
  </main>

  <!-- Input Area -->
  <footer class="p-3 bg-surface border-t border-border shrink-0 pb-6">
    <div class="flex items-center gap-2 bg-card border border-border rounded-full px-4 py-2">
      <input type="text" id="user-input" placeholder="Ask RYZE anything..." autocomplete="off" class="flex-1 bg-transparent text-sm text-white focus:outline-none py-1">
      <button id="send-btn" type="button" class="bg-slate-200 text-black p-2 rounded-full font-bold hover:bg-white transition-all shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </footer>

  <script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage('user', text);
      userInput.value = '';

      const loadingId = appendLoading();

      setTimeout(() => {
        removeLoading(loadingId);
        generateResponse(text);
      }, 500);
    }

    sendBtn.addEventListener('click', sendMessage);
    sendBtn.addEventListener('touchstart', function(e) {
      e.preventDefault();
      sendMessage();
    });

    userInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });

    function appendMessage(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = sender === 'user' ? 'flex justify-end' : 'flex justify-start';

      const innerDiv = document.createElement('div');
      innerDiv.className = sender === 'user' 
        ? 'bg-slate-200 text-black px-4 py-2.5 rounded-2xl rounded-tr-sm max-w-[85%] text-sm font-medium'
        : 'bg-card border border-border text-slate-200 px-4 py-2.5 rounded-2xl rounded-tl-sm max-w-[85%] text-sm leading-relaxed';

      innerDiv.innerHTML = sender === 'user' ? escapeHtml(text) : marked.parse(text);
      msgDiv.appendChild(innerDiv);
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendLoading() {
      const id = 'load-' + Date.now();
      const loadDiv = document.createElement('div');
      loadDiv.id = id;
      loadDiv.className = 'flex justify-start';
      loadDiv.innerHTML = `<div class="bg-card border border-border px-4 py-3 rounded-2xl text-xs text-slate-400 animate-pulse">RYZE is thinking...</div>`;
      chatBox.appendChild(loadDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return id;
    }

    function removeLoading(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function generateResponse(query) {
      let reply = "I'm RYZE! " + query + " received. I can answer questions, generate code, or help you build projects.";
      if (query.toLowerCase().includes('hi') || query.toLowerCase().includes('hello')) {
        reply = "Hello! I'm online and ready. What are we working on today?";
      }
      appendMessage('bot', reply);
    }

    function clearChat() {
      chatBox.innerHTML = '';
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
